            question: 'Tìm cực trị của hàm số $f(x,y) = xy(1 - 2x - 2y) = xy - 2x^2y - 2xy^2$.',
            solution: `
              <ol class="list-decimal list-inside space-y-1">
                <li><strong>Tìm điểm dừng:</strong> $$\\begin{cases} f'_x = y(1 - 4x - 2y) = 0 \\quad (1) \\\\ f'_y = x(1 - 2x - 4y) = 0 \\quad (2) \\end{cases}$$
                  Giải hệ thu được 4 điểm dừng: $M_1(0,0), M_2\\left(\\frac{1}{2}, 0\\right), M_3\\left(0, \\frac{1}{2}\\right), M_4\\left(\\frac{1}{6}, \\frac{1}{6}\\right)$.
                </li>
                <li><strong>Đạo hàm cấp 2:</strong> $A = -4y; \\quad B = 1 - 4x - 4y; \\quad C = -4x$.</li>
                <li><strong>Xét dấu $\\Delta = AC - B^2$:</strong>
                  <ul class="list-disc list-inside ml-4">
                    <li>Tại $M_1(0,0), M_2(1/2,0), M_3(0,1/2)$: Đều có $\\Delta = -1 < 0 \\Rightarrow$ Không là cực trị.</li>
                    <li>Tại $M_4\\left(\\frac{1}{6}, \\frac{1}{6}\\right)$: $A = -\\frac{2}{3}, B = -\\frac{1}{3}, C = -\\frac{2}{3} \\Rightarrow \\Delta = \\frac{1}{3} > 0$. Vì $A < 0 \\Rightarrow M_4\\left(\\frac{1}{6}, \\frac{1}{6}\\right)$ là điểm <strong>Cực đại</strong>.</li>
                  </ul>
                </li>
              </ol>`
          },
          {
            id: 'c_1_3', sprint: 's1', year: '2020-2021', title: 'Bài 1.3 (Đề 2020-2021 - Dạng phân thức đối xứng)',
            question: 'Tìm cực trị của hàm số $f(x,y) = xy + \\frac{1}{x} + \\frac{1}{y}$ (Điều kiện: $x \\ne 0, y \\ne 0$).',
            solution: `
              <ol class="list-decimal list-inside space-y-1">
                <li><strong>Tìm điểm dừng:</strong> $$\\begin{cases} f'_x = y - \\frac{1}{x^2} = 0 \\\\ f'_y = x - \\frac{1}{y^2} = 0 \\end{cases} \\Leftrightarrow \\begin{cases} y = \\frac{1}{x^2} \\\\ x(1 - x^3) = 0 \\end{cases} \\Rightarrow M(1, 1).$$</li>
                <li><strong>Đạo hàm cấp 2:</strong> $A = \\frac{2}{x^3}; \\quad B = 1; \\quad C = \\frac{2}{y^3}$.</li>
                <li><strong>Tại $M(1, 1)$:</strong> $A = 2, B = 1, C = 2 \\Rightarrow \\Delta = 3 > 0$. Vì $A = 2 > 0$ nên $M(1, 1)$ là điểm <strong>Cực tiểu</strong>.</li>
              </ol>`
          },
          {
            id: 'c_1_4', sprint: 's1', year: '2023-2024', title: 'Bài 1.4 (Đề 2023-2024 - Đa thức bậc 3)',
            question: 'Tìm cực trị tự do của $f(x,y) = 2x^3 + xy^2 + 5x^2 + y^2$.',
            solution: `
              <ol class="list-decimal list-inside space-y-1">
                <li><strong>Tìm điểm dừng:</strong> $$\\begin{cases} f'_x = 6x^2 + y^2 + 10x = 0 \\quad (1) \\\\ f'_y = 2y(x + 1) = 0 \\quad (2) \\end{cases}$$
                  Thu được 4 điểm dừng: $M_1(0,0), M_2\\left(-\\frac{5}{3}, 0\\right), M_3(-1, 2), M_4(-1, -2)$.
                </li>
                <li><strong>Đạo hàm cấp 2:</strong> $A = 12x + 10; \\quad B = 2y; \\quad C = 2x + 2$.</li>
                <li><strong>Kết luận:</strong>
                  <ul class="list-disc list-inside ml-4">
                    <li>$M_1(0,0)$: $A = 10, B = 0, C = 2 \\Rightarrow \\Delta = 20 > 0, A > 0 \\Rightarrow$ <strong>Cực tiểu</strong>.</li>
                    <li>$M_2\\left(-\\frac{5}{3}, 0\\right)$: $A = -10, B = 0, C = -\\frac{4}{3} \\Rightarrow \\Delta = \\frac{40}{3} > 0, A < 0 \\Rightarrow$ <strong>Cực đại</strong>.</li>
                    <li>$M_3(-1, 2)$ và $M_4(-1, -2)$: $A = -2, B = \\pm 4, C = 0 \\Rightarrow \\Delta = -16 < 0 \\Rightarrow$ <strong>Không là cực trị</strong>.</li>
                  </ul>
                </li>
              </ol>`
          },
          {
            id: 'c_1_5', sprint: 's1', year: '2024-2025', title: 'Bài 1.5 (Đề 2024-2025 - Dạng tích có hàm mũ $e^{x-y}$)',
            question: 'Tìm cực trị tự do của $f(x,y) = e^{x-y}(x^2 + 2y^2)$.',
            solution: `
              <ol class="list-decimal list-inside space-y-1">
                <li><strong>Tìm điểm dừng:</strong> Chia bỏ $e^{x-y} > 0$, giải hệ:
                  $$\\begin{cases} x^2 + 2y^2 + 2x = 0 \\\\ -x^2 - 2y^2 + 4y = 0 \\end{cases} \\Rightarrow x = -2y \\Rightarrow M_1(0,0), M_2\\left(-\\frac{4}{3}, \\frac{2}{3}\\right).$$
                </li>
                <li><strong>Đạo hàm cấp 2:</strong> $A = e^{x-y}(x^2+2y^2+4x+2), B = e^{x-y}(-x^2-2y^2-2x+4y), C = e^{x-y}(x^2+2y^2-8y+4)$.</li>
                <li><strong>Kết luận:</strong> Tại $M_1(0,0)$ có $A=2, B=0, C=4 \\Rightarrow \\Delta = 8 > 0, A > 0 \\Rightarrow$ <strong>Cực tiểu</strong>. Tại $M_2(-4/3, 2/3)$ có $\\Delta = -8e^{-4} < 0 \\Rightarrow$ <strong>Không là cực trị</strong>.</li>
              </ol>`
          },
          {
            id: 'c_1_6', sprint: 's1', year: '2025-2026', title: 'Bài 1.6 (Đề 2025-2026 - Đa thức bậc 4 đối xứng)',
            question: 'Tìm cực trị tự do của $f(x,y) = 2x^4 + 2y^4 - 3x^2 - 6xy - 3y^2$.',
            solution: `
              <ol class="list-decimal list-inside space-y-1">
                <li><strong>Tìm điểm dừng:</strong> $$\\begin{cases} 8x^3 - 6x - 6y = 0 \\\\ 8y^3 - 6x - 6y = 0 \\end{cases} \\Rightarrow y = x \\Rightarrow M_1(0,0), M_{2,3}\\left(\\pm\\sqrt{\\frac{3}{2}}, \\pm\\sqrt{\\frac{3}{2}}\\right).$$</li>
                <li><strong>Đạo hàm cấp 2:</strong> $A = 24x^2 - 6; \\quad B = -6; \\quad C = 24y^2 - 6$.</li>
                <li><strong>Kết luận:</strong>
                  <ul class="list-disc list-inside ml-4">
                    <li>Tại $M_2, M_3$: $A=30, B=-6, C=30 \\Rightarrow \\Delta = 864 > 0, A > 0 \\Rightarrow$ Cả 2 đều là <strong>Cực tiểu</strong>.</li>
                    <li>Tại $M_1(0,0)$: $\\Delta = 0$. Xét đường $y=-x \\Rightarrow f(x,-x) = 4x^4 > 0$; đường $y=x \\Rightarrow f(x,x) = 4x^2(x^2-3) < 0$ (khi $x$ gần $0$). Do đổi dấu nên $M_1(0,0)$ <strong>không là cực trị</strong>.</li>
                  </ul>
                </li>
              </ol>`
          },
          {
            id: 'c_1_7', sprint: 's1', year: '2022-2023', title: 'Bài 1.7 (Đề 2022-2023 - Bậc 4 nhưng không suy biến)',
            question: 'Tìm cực trị của $f(x,y) = x^4 + y^4 + 2x^2y^2 + 2x^2 + 2y^2 + 4$.',
            solution: `
              <ol class="list-decimal list-inside space-y-1">
                <li><strong>Tìm điểm dừng:</strong> $\\begin{cases} 4x(x^2+y^2+1) = 0 \\\\ 4y(x^2+y^2+1) = 0 \\end{cases} \\Leftrightarrow M(0,0)$.</li>
                <li><strong>Đạo hàm cấp 2 tại $M(0,0)$:</strong> $A = 4, B = 0, C = 4 \\Rightarrow \\Delta = 16 > 0, A > 0 \\Rightarrow M(0,0)$ là điểm <strong>Cực tiểu</strong>.</li>
              </ol>`
          },

          // SPRINT 2: GIỚI HẠN
          {
            id: 'c_2_1', sprint: 's2', year: '2022-2023', title: 'Bài 2.1 (Đề 2022-2023 - Đồng bậc đa thức)',
            question: 'Giới hạn sau có tồn tại không? $\\lim_{(x,y)\\to(0,0)} \\frac{(x-1)y}{x^2+y^2}$.',
            solution: 'Chọn đường thẳng $y = kx$ ($k \\ne 0$). Khi $x \\to 0$: $L = \\lim_{x \\to 0} \\frac{(x-1)k}{x(1+k^2)} = \\infty$. Hoặc chọn $y=0 \\Rightarrow L=0$; chọn $x=0 \\Rightarrow L = \\lim_{y\\to 0} \\frac{-1}{y}$ (không tồn tại). Vậy giới hạn <strong>không tồn tại</strong>.'
          },
          {
            id: 'c_2_2', sprint: 's2', year: '2018-2019', title: 'Bài 2.2 (Đề 2018-2019 - Đồng bậc lượng giác)',
            question: 'Chứng tỏ giới hạn sau không tồn tại: $\\lim_{(x,y)\\to(0,0)} \\frac{\\sin(x^2-y^2)}{x^2+y^2}$.',
            solution: 'Khi $(x,y) \\to (0,0)$, $\\sin(x^2-y^2) \\sim x^2-y^2$. Chọn $y = kx$: $$L = \\lim_{x \\to 0} \\frac{x^2 - k^2x^2}{x^2 + k^2x^2} = \\frac{1 - k^2}{1 + k^2}$$ Phụ thuộc vào $k \\Rightarrow$ Giới hạn <strong>không tồn tại</strong>.'
          },
          {
            id: 'c_2_3', sprint: 's2', year: '2023-2024', title: 'Bài 2.3 (Đề 2023-2024 - Đồng bậc có $\\cos$)',
            question: 'Chứng minh giới hạn sau không tồn tại: $\\lim_{(x,y)\\to(0,0)} \\frac{\\cos 2y - \\cos 2x}{2(y^2+x^2)}$.',
            solution: 'Ta có $\\cos 2y - \\cos 2x = (1 - \\cos 2x) - (1 - \\cos 2y) \\sim 2x^2 - 2y^2$. Chọn $y = kx$: $$L = \\lim_{x \\to 0} \\frac{2x^2 - 2k^2x^2}{2(k^2x^2 + x^2)} = \\frac{1 - k^2}{1 + k^2}$$ Phụ thuộc vào $k \\Rightarrow$ Giới hạn <strong>không tồn tại</strong>.'
          },
          {
            id: 'c_2_4', sprint: 's2', year: '2024-2025', title: 'Bài 2.4 (Đề 2024-2025 - Đồng bậc có $\\sin y$)',
            question: 'Chứng minh giới hạn sau không tồn tại: $\\lim_{(x,y)\\to(0,0)} \\frac{x\\sin y}{xy+y^2}$.',
            solution: 'Khi $y \\to 0$, $\\sin y \\sim y$. Chọn $y = kx$ ($k \\ne 0, -1$): $$L = \\lim_{x \\to 0} \\frac{k x^2}{(k + k^2)x^2} = \\frac{1}{1 + k}$$ Phụ thuộc vào $k \\Rightarrow$ Giới hạn <strong>không tồn tại</strong>.'

          {
            id: 'c_2_5', sprint: 's2', year: '2017-2018', title: 'Bài 2.5 (Đề 2017-2018 - Lệch bậc & Xét tính liên tục)',
            question: 'Xét tính liên tục của $f(x,y) = \\begin{cases} \\frac{x^2y^3}{x^4+y^6} & \\text{khi } (x,y) \\ne (0,0) \\\\ 0 & \\text{khi } (x,y) = (0,0) \\end{cases}$ trên $\\mathbb{R}^2$.',
            solution: 'Tại $(0,0)$, chọn đường cong cân bằng bậc $x = k \\cdot y^{3/2}$ ($y > 0$). Khi $y \\to 0^+$: $$\\lim_{y \\to 0^+} \\frac{k^2 y^6}{(k^4 + 1)y^6} = \\frac{k^2}{k^4 + 1}$$ Phụ thuộc vào $k \\Rightarrow$ Không tồn tại giới hạn tại $(0,0) \\Rightarrow$ Hàm số <strong>gián đoạn tại $(0,0)$</strong>.'
          },
          {
            id: 'c_2_6', sprint: 's2', year: '2020-2021', title: 'Bài 2.6 (Đề 2020-2021 - Lệch bậc tại $(2,0)$)',
            question: 'Chứng tỏ giới hạn không tồn tại: $\\lim_{(x,y)\\to(2,0)} \\frac{(x-2)y^2}{(x-2)^3+y^4}$.',
            solution: 'Chọn đường $y = 0, x \\to 2 \\Rightarrow L = 0$. Chọn đường cong $x - 2 = y^{4/3}, y \\to 0 \\Rightarrow L = \\lim_{y \\to 0} \\frac{y^{10/3}}{2y^4} = +\\infty$. Hai đường cho kết quả khác nhau $\\Rightarrow$ Giới hạn <strong>không tồn tại</strong>.'

            question: 'Chứng minh giới hạn sau không tồn tại: $\\lim_{(x,y)\\to(-1,0)} \\frac{(x+1)^2y^3}{(x+1)^6+y^9}$.',
            solution: 'Chọn đường $y = 0, x \\to -1 \\Rightarrow L = 0$. Chọn đường cong $x + 1 = y^{3/2}$ ($y > 0$) hoặc $x+1 = y^2 \\Rightarrow L = +\\infty$. Vậy giới hạn <strong>không tồn tại</strong>.'

          // SPRINT 3: CHUỖI SỐ & CHUỖI LŨY THỪA
          {
            id: 'c_3_1', sprint: 's3', year: '2017-2026', title: 'Bài 3.1 (Tổng hợp Câu 3a - Khảo sát chuỗi số qua 7 đề UIT)',
            question: 'Khảo sát sự hội tụ của các chuỗi số trong đề thi 2017–2026.',
            solution: `
              <ul class="space-y-2 text-sm">
                <li>• <strong>Đề 2024-2025:</strong> $\\sum_{n=1}^{\\infty} \\frac{n! 3^n}{n^n} \\Rightarrow$ D'Alembert: $D = \\frac{3}{e} > 1 \\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2017-2018:</strong> $\\sum_{n=1}^{+\\infty} \\frac{(-1)^n 2^n n!}{n^n} \\Rightarrow$ Xét trị tuyệt đối có $D = \\frac{2}{e} < 1 \\Rightarrow$ <strong>Hội tụ</strong>.</li>
                <li>• <strong>Đề 2023-2024:</strong> $\\sum_{n=1}^{\\infty} \\frac{1}{3^n} \\left(\\frac{n+2023}{n+2022}\\right)^{n^2} \\Rightarrow$ Cauchy: $C = \\frac{e}{3} < 1 \\Rightarrow$ <strong>Hội tụ</strong>.</li>
                <li>• <strong>Đề 2020-2021:</strong> $\\sum_{n=1}^{\\infty} \\frac{1}{3^n} \\left(\\frac{n+3}{n+1}\\right)^{n^2} \\Rightarrow$ Cauchy: $C = \\frac{e^2}{3} > 1 \\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2025-2026:</strong> $\\sum_{n=1}^{\\infty} \\left(\\cos\\frac{1}{n}\\right)^{-4n^3+n^2} \\Rightarrow$ Cauchy: $C = \\lim \\left(1 - \\frac{1}{2n^2}\\right)^{-4n^2+n} = (e^{-1/2})^{-4} = e^2 > 1 \\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2018-2019 (Tính tổng):</strong> $\\sum_{n=1}^{+\\infty} \\frac{1}{n(n+3)} = \\frac{1}{3}\\left(1 + \\frac{1}{2} + \\frac{1}{3}\\right) = \\frac{11}{18}$.</li>
              </ul>`
          },
          {
            id: 'c_3_2', sprint: 's3', year: '2017-2026', title: 'Bài 3.2 (Tổng hợp Câu 3b - Tìm miền hội tụ chuỗi lũy thừa qua 7 đề)',
            question: 'Tìm miền hội tụ của các chuỗi lũy thừa từ đề thi 2017–2026.',
            solution: `
              <ul class="space-y-2 text-sm">
                <li>• <strong>Đề 2025-2026:</strong> $\\sum \\frac{(2x+3)^n}{3^n} \\Rightarrow \\left|\\frac{2x+3}{3}\\right| < 1 \\Leftrightarrow -3 < x < 0$. Hai đầu mút PK $\\Rightarrow D = (-3; 0)$.</li>
                <li>• <strong>Đề 2024-2025:</strong> $\\sum_{n=2}^{\\infty} \\frac{x^n}{n\\ln n} \\Rightarrow -1 < x < 1$. Tại $x=-1$ HT (Leibnitz), $x=1$ PK $\\Rightarrow D = [-1; 1)$.</li>
                <li>• <strong>Đề 2023-2024:</strong> $\\sum \\frac{(x-1)^n}{2^{n+1}\\sqrt{n^2+2n-\\cos n}} \\Rightarrow D = [-1; 3)$.</li>
                <li>• <strong>Đề 2022-2023:</strong> $\\sum \\frac{n!}{n^n}x^n \\Rightarrow$ D'Alembert $\\frac{|x|}{e} < 1 \\Rightarrow D = (-e; e)$.</li>
                <li>• <strong>Đề 2020-2021:</strong> $\\sum \\frac{(x-1)^n}{\\sqrt{n^2+2}\\cdot 3^n} \\Rightarrow D = [-2; 4)$.</li>
                <li>• <strong>Đề 2018-2019 & 2017-2018:</strong> $\\sum \\frac{(x+3)^{3n}}{n^2 8^n}$ và $\\sum \\frac{(x+3)^{2n}}{n^2 4^n} \\Rightarrow$ Đều có $D = [-5; -1]$.</li>
              </ul>`
          },

          {
            id: 'c_4_1', sprint: 's4', year: '2017-2026', title: 'Bài 4.1 (Nhóm 1: Tích phân suy rộng cận $+\\infty$)',
            question: 'Xét sự hội tụ của các tích phân cận $+\\infty$ trong đề thi 2017–2026.',
            solution: `
              <ul class="space-y-2 text-sm">
                <li>• <strong>Đề 2025-2026 (Ý B):</strong> $\\int_0^{+\\infty} \\frac{(x+2)dx}{\\pi^2(x+3\\cos x+5)} \\sim \\int \\frac{dx}{\\pi^2} \\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2024-2025 (Ý B):</strong> $\\int_1^{+\\infty} \\ln(\\cos\\frac{1}{x})dx$: $\\left|\\ln(\\cos\\frac{1}{x})\\right| \\sim \\frac{1}{2x^2}$ ($\\alpha=2>1$) $\\Rightarrow$ <strong>Hội tụ</strong>.</li>
                <li>• <strong>Đề 2023-2024 (Ý A):</strong> $\\int_1^{+\\infty} \\frac{2x^2+x+1}{e^{4x}+x^3+3}dx < \\int_1^{+\\infty} \\frac{dx}{x^2} \\Rightarrow$ <strong>Hội tụ</strong>.</li>

                <li>• <strong>Đề 2018-2019 (Ý 4b):</strong> $\\int_1^{+\\infty} \\frac{xdx}{x^3+2\\sin x+2} \\sim \\int_1^{+\\infty} \\frac{dx}{x^2} \\Rightarrow$ <strong>Hội tụ</strong>.</li>
                <li>• <strong>Đề 2017-2018 (Câu 4):</strong> $\\int_1^{+\\infty} \\frac{dx}{\\ln x + \\sin x + 1} > \\int_1^{+\\infty} \\frac{dx}{x} \\Rightarrow$ <strong>Phân kỳ</strong>.</li>
              </ul>`

          {

            question: 'Xét sự hội tụ của các tích phân có kỳ dị hữu hạn trong đề thi UIT.',
            solution: `
              <ul class="space-y-2 text-sm">
                <li>• <strong>Đề 2025-2026 (Ý A) & 2020-2021 (Ý 4a):</strong> $A = \\int_0^1 \\frac{\\sin(1-x)dx}{\\sqrt[3]{1-x^3}(e^{1-x^2}-1)}$. Khi $x \\to 1^-$: hàm dưới dấu tích phân $\\sim \\frac{1-x}{\\sqrt[3]{3}(1-x)^{1/3} \\cdot 2(1-x)} = \\frac{1}{2\\sqrt[3]{3}(1-x)^{1/3}}$ ($\\alpha = 1/3 < 1$) $\\Rightarrow$ <strong>Hội tụ</strong>.</li>
                <li>• <strong>Đề 2023-2024 (Ý B):</strong> $\\int_0^1 \\frac{2x+1}{(x^3-1)(3x+4)(5x+7)}dx$: Khi $x \\to 1^-$, $|f(x)| \\sim \\frac{1}{84(1-x)}$ ($\\alpha=1 \\ge 1$) $\\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2018-2019 (Ý 4a):</strong> $\\int_2^3 \\frac{dx}{\\ln(x-1)}$: Khi $x \\to 2^+$, $\\ln(x-1) \\sim x-2$ ($\\alpha=1$) $\\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2024-2025 (Ý A):</strong> $\\int_1^{+\\infty} \\frac{3x+1}{x^2+x-2}dx$: Tách tại $x=2$, khi $x \\to +\\infty$ có $f(x) \\sim \\frac{3}{x}$ $\\Rightarrow$ <strong>Phân kỳ</strong>.</li>
                <li>• <strong>Đề 2022-2023 (Ý B):</strong> $\\int_0^{+\\infty} \\frac{\\arctan x}{x\\sqrt{x}}dx$: Tách tại $x=1$; khi $x \\to 0^+$ thì $f(x) \\sim x^{-1/2}$ (HT); khi $x \\to +\\infty$ thì $f(x) \\sim \\frac{\\pi}{2}x^{-3/2}$ (HT) $\\Rightarrow$ <strong>Hội tụ</strong>.</li>
              </ul>`
          }
        ],
        checklist: [

            question: 'Trên $\\mathbb{R}^4$ cho tập hợp $W = \\{X = (a, b, c, d) \\mid 5a - b + 2c - 3d = 0\\}$. Hỏi $W$ có phải là không gian véc-tơ con của $\\mathbb{R}^4$ hay không? Vì sao?',

                <p>• <strong>Ý 2:</strong> Lấy $X = (a_1, b_1, c_1, d_1) \\in W$ và $Y = (a_2, b_2, c_2, d_2) \\in W$. Ta có $5a_1 - b_1 + 2c_1 - 3d_1 = 0$ và $5a_2 - b_2 + 2c_2 - 3d_2 = 0$.

                  $$5(a_1+a_2) - (b_1+b_2) + 2(c_1+c_2) - 3(d_1+d_2) = 0 + 0 = 0 \\Rightarrow X+Y \\in W.$$

                <p>👉 <strong>Kết luận:</strong> Vậy $W$ là một không gian véc-tơ con của $M_2(\\mathbb{R})$.</p>

    // ==========================================
    // STATE MANAGEMENT
    // ==========================================
    let currentSubject = localStorage.getItem('uit_active_subject') || 'calc';
    let currentTab = 'overview';
    let currentSprint = 'all';

    function getCompletedMap(subj) {
      try {
        return JSON.parse(localStorage.getItem(SUBJECT_DATA[subj].storageCompletedKey)) || {};
      } catch { return {}; }
    }

    function saveCompletedMap(subj, map) {
      localStorage.setItem(SUBJECT_DATA[subj].storageCompletedKey, JSON.stringify(map));
    }

    function getChecklistMap(subj) {
      try {
        return JSON.parse(localStorage.getItem(SUBJECT_DATA[subj].storageChecklistKey)) || {};
      } catch { return {}; }
    }

    function saveChecklistMap(subj, map) {
      localStorage.setItem(SUBJECT_DATA[subj].storageChecklistKey, JSON.stringify(map));
    }

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================
    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function switchSubject(subj) {
      currentSubject = subj;
      localStorage.setItem('uit_active_subject', subj);
      currentSprint = 'all';

      // Highlight active subject button
      const calcBtn = document.getElementById('btn-subj-calc');
      const laBtn = document.getElementById('btn-subj-la');
      if (subj === 'calc') {
        calcBtn.className = "px-3 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-800 text-uit-600 dark:text-blue-400 shadow-sm transition-all";
        laBtn.className = "px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all";
      } else {
        laBtn.className = "px-3 py-1.5 rounded-lg text-sm font-semibold bg-white dark:bg-slate-800 text-uit-600 dark:text-blue-400 shadow-sm transition-all";
        calcBtn.className = "px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all";
      }

      const data = SUBJECT_DATA[subj];
      document.getElementById('hero-badge').textContent = data.badge;
      document.getElementById('hero-title').textContent = data.title;
      document.getElementById('hero-subtitle').textContent = data.subtitle;

      document.getElementById('view-overview').innerHTML = data.overviewHTML;
      document.getElementById('view-cheatsheet').innerHTML = data.cheatsheetHTML;

      renderSprintFilters();
      renderProblems();
      renderChecklist();
      updateProgressBars();
      renderMath();
    }

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${tabId}`).classList.remove('hidden');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn px-4 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`tab-${tabId}`);
      activeBtn.className = "tab-btn px-4 py-2.5 border-b-2 border-uit-600 text-uit-600 dark:text-blue-400 dark:border-blue-400 font-semibold whitespace-nowrap";
      renderMath();
    }

    function renderSprintFilters() {
      const sprints = SUBJECT_DATA[currentSubject].sprints;
      const container = document.getElementById('sprint-filters');
      container.innerHTML = sprints.map(s => {
        const active = s.id === currentSprint;
        return `<button onclick="selectSprint('${s.id}')" class="text-xs px-3 py-1.5 rounded-xl font-semibold transition-all ${
          active ? 'bg-uit-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
        }">${s.label}</button>`;
      }).join('');
    }

    function selectSprint(sprintId) {
      currentSprint = sprintId;
      renderSprintFilters();
      renderProblems();
    }

    function renderProblems() {
      const data = SUBJECT_DATA[currentSubject];
      const completedMap = getCompletedMap(currentSubject);
      const query = (document.getElementById('search-input')?.value || '').toLowerCase();

      const filtered = data.problems.filter(p => {
        const matchSprint = currentSprint === 'all' || p.sprint === currentSprint;
        const matchSearch = !query || p.title.toLowerCase().includes(query) || p.question.toLowerCase().includes(query) || p.year.toLowerCase().includes(query);
        return matchSprint && matchSearch;
      });

      const container = document.getElementById('problems-container');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-white dark:bg-slate-800 rounded-2xl">Không tìm thấy câu hỏi phù hợp.</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const isDone = !!completedMap[p.id];
        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border ${isDone ? 'border-emerald-400 dark:border-emerald-600' : 'border-slate-200 dark:border-slate-700'} transition-all">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/50 text-uit-700 dark:text-blue-300">Đề ${p.year}</span>
                <h3 class="font-bold text-base">${p.title}</h3>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="toggleSolution('${p.id}')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 font-medium">
                  👁️ Xem / Ẩn lời giải
                </button>
                <button onclick="toggleProblemDone('${p.id}')" class="text-xs px-3 py-1.5 rounded-xl font-semibold transition-all ${
                  isDone ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
                }">
                  ${isDone ? '✓ Đã hiểu' : 'Đánh dấu đã hiểu'}
                </button>
              </div>
            </div>
            <div class="text-sm bg-slate-50 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-100 dark:border-slate-700/60">
              ${p.question}
            </div>
            <div id="sol-${p.id}" class="solution-box hidden mt-3 p-4 rounded-xl bg-emerald-50/60 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/60 text-sm">
              <div class="font-bold text-emerald-800 dark:text-emerald-300 mb-2">Lời giải chi tiết:</div>
              ${p.solution}
            </div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function toggleSolution(id) {
      const el = document.getElementById(`sol-${id}`);
      if (el) el.classList.toggle('hidden');
    }

    function toggleAllSolutions(show) {
      document.querySelectorAll('.solution-box').forEach(el => {
        if (show) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
    }

    function toggleProblemDone(id) {
      const map = getCompletedMap(currentSubject);
      map[id] = !map[id];
      saveCompletedMap(currentSubject, map);
      renderProblems();
      updateProgressBars();
    }

    function renderChecklist() {
      const list = SUBJECT_DATA[currentSubject].checklist;
      const map = getChecklistMap(currentSubject);
      const container = document.getElementById('checklist-container');

      container.innerHTML = list.map((item, idx) => {
        const checked = !!map[idx];
        return `
          <label class="flex items-start gap-3 p-3.5 rounded-xl border ${checked ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-300 dark:border-emerald-700' : 'bg-slate-50 dark:bg-slate-900/40 border-slate-200 dark:border-slate-700'} cursor-pointer transition-all">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleChecklistItem(${idx})" class="mt-1 h-4 w-4 rounded text-uit-600 focus:ring-uit-500" />
            <span class="text-sm ${checked ? 'line-through text-slate-400' : ''}">${item}</span>
          </label>
        `;
      }).join('');
      renderMath();
    }

    function toggleChecklistItem(idx) {
      const map = getChecklistMap(currentSubject);
      map[idx] = !map[idx];
      saveChecklistMap(currentSubject, map);
      renderChecklist();
      updateProgressBars();
    }

    function updateProgressBars() {
      const data = SUBJECT_DATA[currentSubject];
      const completedMap = getCompletedMap(currentSubject);
      const checklistMap = getChecklistMap(currentSubject);

      const totalProb = data.problems.length;
      const doneProb = data.problems.filter(p => completedMap[p.id]).length;
      const probPct = totalProb ? Math.round((doneProb / totalProb) * 100) : 0;

      document.getElementById('progress-text').textContent = `${doneProb}/${totalProb} (${probPct}%)`;
      document.getElementById('progress-bar').style.width = `${probPct}%`;

      const totalCheck = data.checklist.length;
      const doneCheck = Object.values(checklistMap).filter(Boolean).length;
      const checkPct = totalCheck ? Math.round((doneCheck / totalCheck) * 100) : 0;

      document.getElementById('checklist-progress-text').textContent = `${doneCheck}/${totalCheck} (${checkPct}%)`;
      document.getElementById('checklist-progress-bar').style.width = `${checkPct}%`;
    }

    // ==========================================
    // 60-MINUTE EXAM TIMER
    // ==========================================
    let timerSeconds = 60 * 60;
    let timerInterval = null;

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-btn');
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = 'Tiếp tục';
      } else {
        btn.textContent = 'Tạm dừng';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.textContent = 'Bắt đầu';
            alert('⏰ Hết giờ làm bài 60 phút!');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 60 * 60;
      updateTimerDisplay();
      document.getElementById('timer-btn').textContent = 'Bắt đầu';
    }

    // ==========================================
    // BACKUP & RESTORE PROGRESS (KEEP OLD DATA SAFE)
    // ==========================================
    function exportProgress() {
      const backup = {
        uit_calc_completed_v1: localStorage.getItem('uit_calc_completed_v1'),
        uit_calc_checklist_v1: localStorage.getItem('uit_calc_checklist_v1'),
        uit_la_completed_v1: localStorage.getItem('uit_la_completed_v1'),
        uit_la_checklist_v1: localStorage.getItem('uit_la_checklist_v1')
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'uit-math-progress-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importProgress(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          Object.keys(data).forEach(k => {
            if (data[k]) localStorage.setItem(k, data[k]);
          });
          switchSubject(currentSubject);
          alert('✅ Khôi phục tiến độ học tập thành công!');
        } catch {
          alert('❌ File sao lưu không hợp lệ.');
        }
      };
      reader.readAsText(file);
    }

    // ==========================================
    // DARK MODE & INIT
    // ==========================================
    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('uit_theme_dark', isDark ? '1' : '0');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('uit_theme_dark') === '1') {
        document.documentElement.classList.add('dark');
      }
      switchTab('overview');
      switchSubject(currentSubject);
    });
  </script>
</body>
</html>
